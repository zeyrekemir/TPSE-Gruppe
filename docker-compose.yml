services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: robots
      POSTGRES_USER: robots
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U robots"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      ROBOTS_DATABASE_URL: postgresql+psycopg://robots:${POSTGRES_PASSWORD}@db:5432/robots
      ROBOTS_SECRET_KEY: ${ROBOTS_SECRET_KEY:?set ROBOTS_SECRET_KEY in .env}
      ROBOTS_BOOTSTRAP_ADMIN_PASSWORD: ${ROBOTS_BOOTSTRAP_ADMIN_PASSWORD:?set ROBOTS_BOOTSTRAP_ADMIN_PASSWORD in .env}
      ROBOTS_LDAP_URL: ${ROBOTS_LDAP_URL:-}
      ROBOTS_LDAP_USER_DN_TEMPLATE: ${ROBOTS_LDAP_USER_DN_TEMPLATE:-uid={username},ou=people,dc=example,dc=org}
      ROBOTS_LDAP_ADMIN_GROUP_DN: ${ROBOTS_LDAP_ADMIN_GROUP_DN:-}
      ROBOTS_CORS_ORIGINS: '[]'
      ROBOTS_PUBLIC_URL: ${ROBOTS_PUBLIC_URL:-http://localhost:8080}
      ROBOTS_OIDC_ISSUER: ${ROBOTS_OIDC_ISSUER:-}
      ROBOTS_OIDC_CLIENT_ID: ${ROBOTS_OIDC_CLIENT_ID:-}
      ROBOTS_OIDC_CLIENT_SECRET: ${ROBOTS_OIDC_CLIENT_SECRET:-}
      ROBOTS_OIDC_ADMIN_GROUP: ${ROBOTS_OIDC_ADMIN_GROUP:-}
      ROBOTS_SMTP_HOST: ${ROBOTS_SMTP_HOST:-}
      ROBOTS_SMTP_PORT: ${ROBOTS_SMTP_PORT:-587}
      ROBOTS_SMTP_USER: ${ROBOTS_SMTP_USER:-}
      ROBOTS_SMTP_PASSWORD: ${ROBOTS_SMTP_PASSWORD:-}
      ROBOTS_SMTP_FROM: ${ROBOTS_SMTP_FROM:-robots@localhost}
      ROBOTS_DISCORD_WEBHOOK_URL: ${ROBOTS_DISCORD_WEBHOOK_URL:-}
      ROBOTS_MAX_RESERVATION_HOURS: ${ROBOTS_MAX_RESERVATION_HOURS:-0}
      ROBOTS_MAX_ADVANCE_DAYS: ${ROBOTS_MAX_ADVANCE_DAYS:-0}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    depends_on:
      - backend

volumes:
  db-data:
