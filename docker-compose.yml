services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: robots
      POSTGRES_USER: robots
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U robots"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    # Every ROBOTS_* setting in .env (TU-ID, LDAP, mail, Discord, booking rules, ...) reaches the backend.
    env_file: .env
    environment:
      ROBOTS_DATABASE_URL: postgresql+psycopg://robots:${POSTGRES_PASSWORD}@db:5432/robots
      # Required: the stack refuses to start without them.
      ROBOTS_SECRET_KEY: ${ROBOTS_SECRET_KEY:?set ROBOTS_SECRET_KEY in .env}
      ROBOTS_BOOTSTRAP_ADMIN_PASSWORD: ${ROBOTS_BOOTSTRAP_ADMIN_PASSWORD:?set ROBOTS_BOOTSTRAP_ADMIN_PASSWORD in .env}
      # Browser and API share one origin behind nginx, so no cross-origin access is needed.
      ROBOTS_CORS_ORIGINS: '[]'
      ROBOTS_PUBLIC_URL: ${ROBOTS_PUBLIC_URL:-http://localhost:8080}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    depends_on:
      - backend

volumes:
  db-data:
