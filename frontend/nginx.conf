server {
    listen 80;
    root /usr/share/nginx/html;

    gzip on;
    # .glb and .hdr are served as application/octet-stream; the model compresses to roughly half.
    gzip_types text/css application/javascript application/json image/svg+xml application/octet-stream;

    # Welcome-animation assets (robot model, studio lighting): large, never change between releases.
    location /models/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Single-page app: unknown paths load index.html and the router takes over.
    location / {
        try_files $uri /index.html;
    }
}
