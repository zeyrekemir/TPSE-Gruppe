# Runs every test on each push and pull request: the backend against PostgreSQL (what production uses, incl.
# the parallel-booking test), the frontend checks and tests, and the Docker images build.
name: Tests

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: robots
          POSTGRES_PASSWORD: robots-test
          POSTGRES_DB: robots_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U robots"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      ROBOTS_TEST_DATABASE_URL: postgresql+psycopg://robots:robots-test@localhost:5432/robots_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npx eslint src
      - run: npx vitest run
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build ./backend
      - run: docker build ./frontend
